<svg xmlns="http://www.w3.org/2000/svg" width="800" height="356" viewBox="0 0 800 356" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <title id="title">两种主窗与小窗交换方式：交换前与交换后</title>
  <desc id="desc">蓝色 A、橙色 B 分别代表两个应用，颜色始终不变。点击右侧小窗 B：随应用切换位置时，B 留在右侧放大为主窗，A 收入左侧小窗；保持主窗位置时，B 移入左侧主窗，A 收入右侧小窗。</desc>
  <rect x="12" y="12" width="382" height="332" rx="16" fill="#fff" stroke="#e3e8ef" />
  <g transform="translate(36 0)">
    <text x="0" y="41" font-size="19" font-weight="700" fill="#20252d">随应用切换位置</text>
    <text x="0" y="65" font-size="12" fill="#626a78">B 在原侧放大，主窗换边</text>
  </g>
  <g transform="translate(49 89) scale(1.1)">
    <text x="61" y="16" font-size="12" fill="#626a78" text-anchor="middle" font-weight="400">交换前</text>
    <text x="219" y="16" font-size="12" fill="#626a78" text-anchor="middle" font-weight="400">交换后</text>
    <rect x="20" y="27" width="82" height="156" rx="7" fill="none" stroke="#626a78" stroke-width="1.2" />
    <rect x="24" y="31" width="74" height="30" rx="2" fill="#e9edf2" />
    <line x1="30" y1="39" x2="47" y2="39" stroke="#626a78" stroke-width="1.5" stroke-linecap="round" />
    <line x1="30" y1="45" x2="60" y2="45" stroke="#626a78" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="31" cy="54" r="2" fill="#626a78" />
    <circle cx="43" cy="54" r="2" fill="#626a78" />
    <circle cx="55" cy="54" r="2" fill="#626a78" />
    <circle cx="67" cy="54" r="2" fill="#626a78" />
    <circle cx="79" cy="54" r="2" fill="#626a78" />
    <rect x="24" y="64" width="54" height="115" rx="2" fill="#347ff4" />
    <text x="51.0" y="116" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">A</text>
    <text x="51.0" y="133" font-size="10" fill="#fff" text-anchor="middle" font-weight="400">主窗</text>
    <rect x="80" y="64" width="18" height="37" rx="2" fill="#c96521" />
    <text x="89.0" y="87" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">B</text>
    <rect x="80" y="103" width="18" height="37" rx="2" fill="#e9edf2" />
    <rect x="80" y="142" width="18" height="37" rx="2" fill="#e9edf2" />
    <rect x="78" y="62" width="22" height="41" rx="4" fill="none" stroke="#c96521" stroke-width="1.6" />
    <rect x="178" y="27" width="82" height="156" rx="7" fill="none" stroke="#626a78" stroke-width="1.2" />
    <rect x="182" y="31" width="74" height="30" rx="2" fill="#e9edf2" />
    <line x1="188" y1="39" x2="205" y2="39" stroke="#626a78" stroke-width="1.5" stroke-linecap="round" />
    <line x1="188" y1="45" x2="218" y2="45" stroke="#626a78" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="189" cy="54" r="2" fill="#626a78" />
    <circle cx="201" cy="54" r="2" fill="#626a78" />
    <circle cx="213" cy="54" r="2" fill="#626a78" />
    <circle cx="225" cy="54" r="2" fill="#626a78" />
    <circle cx="237" cy="54" r="2" fill="#626a78" />
    <rect x="202" y="64" width="54" height="115" rx="2" fill="#c96521" />
    <text x="229.0" y="116" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">B</text>
    <text x="229.0" y="133" font-size="10" fill="#fff" text-anchor="middle" font-weight="400">主窗</text>
    <rect x="182" y="64" width="18" height="37" rx="2" fill="#347ff4" />
    <text x="191.0" y="87" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">A</text>
    <rect x="182" y="103" width="18" height="37" rx="2" fill="#e9edf2" />
    <rect x="182" y="142" width="18" height="37" rx="2" fill="#e9edf2" />
    <text x="140" y="94" font-size="12" fill="#626a78" text-anchor="middle" font-weight="700">点击 B</text>
    <path d="M115 108 H165 M159 102 L165 108 L159 114" fill="none" stroke="#626a78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="61" y="201" font-size="11" fill="#626a78" text-anchor="middle" font-weight="400">A 是主窗</text>
    <text x="219" y="201" font-size="11" fill="#626a78" text-anchor="middle" font-weight="700">主窗换到右侧</text>
  </g>
  <rect x="406" y="12" width="382" height="332" rx="16" fill="#fff" stroke="#e3e8ef" />
  <g transform="translate(430 0)">
    <text x="0" y="41" font-size="19" font-weight="700" fill="#20252d">保持主窗位置</text>
    <text x="0" y="65" font-size="12" fill="#626a78">主窗留在原侧，只交换应用</text>
  </g>
  <g transform="translate(443 89) scale(1.1)">
    <text x="61" y="16" font-size="12" fill="#626a78" text-anchor="middle" font-weight="400">交换前</text>
    <text x="219" y="16" font-size="12" fill="#626a78" text-anchor="middle" font-weight="400">交换后</text>
    <rect x="20" y="27" width="82" height="156" rx="7" fill="none" stroke="#626a78" stroke-width="1.2" />
    <rect x="24" y="31" width="74" height="30" rx="2" fill="#e9edf2" />
    <line x1="30" y1="39" x2="47" y2="39" stroke="#626a78" stroke-width="1.5" stroke-linecap="round" />
    <line x1="30" y1="45" x2="60" y2="45" stroke="#626a78" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="31" cy="54" r="2" fill="#626a78" />
    <circle cx="43" cy="54" r="2" fill="#626a78" />
    <circle cx="55" cy="54" r="2" fill="#626a78" />
    <circle cx="67" cy="54" r="2" fill="#626a78" />
    <circle cx="79" cy="54" r="2" fill="#626a78" />
    <rect x="24" y="64" width="54" height="115" rx="2" fill="#347ff4" />
    <text x="51.0" y="116" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">A</text>
    <text x="51.0" y="133" font-size="10" fill="#fff" text-anchor="middle" font-weight="400">主窗</text>
    <rect x="80" y="64" width="18" height="37" rx="2" fill="#c96521" />
    <text x="89.0" y="87" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">B</text>
    <rect x="80" y="103" width="18" height="37" rx="2" fill="#e9edf2" />
    <rect x="80" y="142" width="18" height="37" rx="2" fill="#e9edf2" />
    <rect x="78" y="62" width="22" height="41" rx="4" fill="none" stroke="#c96521" stroke-width="1.6" />
    <rect x="178" y="27" width="82" height="156" rx="7" fill="none" stroke="#626a78" stroke-width="1.2" />
    <rect x="182" y="31" width="74" height="30" rx="2" fill="#e9edf2" />
    <line x1="188" y1="39" x2="205" y2="39" stroke="#626a78" stroke-width="1.5" stroke-linecap="round" />
    <line x1="188" y1="45" x2="218" y2="45" stroke="#626a78" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="189" cy="54" r="2" fill="#626a78" />
    <circle cx="201" cy="54" r="2" fill="#626a78" />
    <circle cx="213" cy="54" r="2" fill="#626a78" />
    <circle cx="225" cy="54" r="2" fill="#626a78" />
    <circle cx="237" cy="54" r="2" fill="#626a78" />
    <rect x="182" y="64" width="54" height="115" rx="2" fill="#c96521" />
    <text x="209.0" y="116" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">B</text>
    <text x="209.0" y="133" font-size="10" fill="#fff" text-anchor="middle" font-weight="400">主窗</text>
    <rect x="238" y="64" width="18" height="37" rx="2" fill="#347ff4" />
    <text x="247.0" y="87" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">A</text>
    <rect x="238" y="103" width="18" height="37" rx="2" fill="#e9edf2" />
    <rect x="238" y="142" width="18" height="37" rx="2" fill="#e9edf2" />
    <text x="140" y="94" font-size="12" fill="#626a78" text-anchor="middle" font-weight="700">点击 B</text>
    <path d="M115 108 H165 M159 102 L165 108 L159 114" fill="none" stroke="#626a78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="61" y="201" font-size="11" fill="#626a78" text-anchor="middle" font-weight="400">A 是主窗</text>
    <text x="219" y="201" font-size="11" fill="#626a78" text-anchor="middle" font-weight="700">主窗仍在左侧</text>
  </g>
</svg>

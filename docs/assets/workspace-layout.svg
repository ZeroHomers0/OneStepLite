<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">OneStepLite 工作区布局与三步操作</title>
  <desc id="desc">顶部是时钟、One Step 标题栏与常用应用栏。下方为一个蓝色主窗和三个橙色小窗格。先打开应用，再点击空格收纳；点击已有小窗交换；向外滑出将任务交还系统后台。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#fff7f0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6bf0"/><stop offset="1" stop-color="#0157e6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a2b"/><stop offset="1" stop-color="#fe7302"/>
    </linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L6 3.5L0 7" fill="none" stroke="#0157e6" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1038" height="638" rx="28" fill="url(#page)" stroke="#e3eaf5"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <rect x="42" y="29" width="442" height="580" rx="32" fill="#e8eefb"/>
    <rect x="48" y="23" width="430" height="580" rx="30" fill="#fff" stroke="#cfdcef" stroke-width="2"/>

    <!-- 时钟 -->
    <text x="72" y="76" fill="#0f1b2d" font-size="30" font-weight="650">09:41</text>
    <text x="72" y="98" fill="#7b8aa0" font-size="13">10月29日 星期三 · 九月初九</text>

    <!-- 标题栏：One Step + 四个固定按钮 -->
    <rect x="62" y="112" width="402" height="46" rx="14" fill="url(#blue)"/>
    <g stroke="#dbe8ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="78" y="126" width="18" height="18" rx="4"/>
      <path d="M87 126v18"/>
      <rect x="118" y="126" width="18" height="18" rx="4"/>
      <path d="M127 126v18"/>
      <circle cx="404" cy="135" r="8"/>
      <path d="M404 131v4l3 2"/>
      <path d="M432 128h14M432 135h14M432 142h14"/>
    </g>
    <text x="263" y="141" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">One Step</text>

    <!-- 常用应用栏 -->
    <rect x="62" y="166" width="402" height="40" rx="12" fill="#eef3fd"/>
    <g fill="#c3d3ea">
      <rect x="76" y="176" width="20" height="20" rx="6"/>
      <rect x="106" y="176" width="20" height="20" rx="6"/>
      <rect x="136" y="176" width="20" height="20" rx="6"/>
      <rect x="166" y="176" width="20" height="20" rx="6"/>
      <rect x="196" y="176" width="20" height="20" rx="6"/>
    </g>
    <text x="440" y="191" text-anchor="end" fill="#6b7c94" font-size="13">常用应用 · 长按自定义</text>

    <!-- 主窗 -->
    <rect x="62" y="218" width="284" height="368" rx="16" fill="#f7faff" stroke="#c9d9f0"/>
    <rect x="78" y="235" width="252" height="8" rx="4" fill="#dbe6f7"/>
    <rect x="78" y="254" width="172" height="7" rx="3.5" fill="#e6edf8"/>
    <text x="204" y="392" text-anchor="middle" fill="#0157e6" font-size="30" font-weight="650">主窗</text>
    <text x="204" y="424" text-anchor="middle" fill="#6b7c94" font-size="15">点按 · 滚动 · 输入</text>
    <rect x="91" y="500" width="226" height="72" rx="10" fill="#e9f0fb"/>
    <g fill="#f7faff">
      <rect x="103" y="512" width="202" height="10" rx="3"/>
      <rect x="112" y="530" width="184" height="10" rx="3"/>
      <rect x="153" y="548" width="102" height="10" rx="3"/>
    </g>

    <!-- 三个小窗格 -->
    <rect x="358" y="218" width="106" height="116" rx="14" fill="#ffe9d6"/>
    <text x="411" y="270" text-anchor="middle" fill="#c85a00" font-size="17" font-weight="600">小窗 1</text>
    <text x="411" y="297" text-anchor="middle" fill="#a06a3a" font-size="13">点按交换</text>
    <rect x="358" y="344" width="106" height="116" rx="14" fill="#fff1e4"/>
    <text x="411" y="396" text-anchor="middle" fill="#c85a00" font-size="17" font-weight="600">小窗 2</text>
    <text x="411" y="423" text-anchor="middle" fill="#a06a3a" font-size="13">向外滑出</text>
    <rect x="358" y="470" width="106" height="116" rx="14" fill="#fff8f1" stroke="#f0c9a4" stroke-dasharray="5 5"/>
    <path d="M399 513H423M411 501V525" stroke="#fe7302" stroke-width="2.5" stroke-linecap="round"/>
    <text x="411" y="552" text-anchor="middle" fill="#a06a3a" font-size="13">收纳当前应用</text>
    <path d="M333 313H370" fill="none" stroke="#0157e6" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- 右侧说明 -->
    <text x="539" y="94" fill="#0f1b2d" font-size="30" font-weight="700">把应用留在眼前</text>
    <text x="540" y="126" fill="#6b7c94" font-size="16">一个主窗，三个真实小窗，随手交换。</text>
    <g>
      <circle cx="558" cy="199" r="19" fill="#dbe8ff"/>
      <text x="558" y="205" text-anchor="middle" fill="#0157e6" font-size="18" font-weight="700">1</text>
      <text x="595" y="198" fill="#0f1b2d" font-size="21" font-weight="650">先打开，再收纳</text>
      <text x="595" y="228" fill="#6b7c94" font-size="16">主窗打开应用 → 点空格「＋」</text>
    </g>
    <g>
      <circle cx="558" cy="307" r="19" fill="#ffe4cc"/>
      <text x="558" y="313" text-anchor="middle" fill="#c85a00" font-size="18" font-weight="700">2</text>
      <text x="595" y="306" fill="#0f1b2d" font-size="21" font-weight="650">点谁，就操作谁</text>
      <text x="595" y="336" fill="#6b7c94" font-size="16">点击已有小窗，与主窗交换</text>
    </g>
    <g>
      <circle cx="558" cy="415" r="19" fill="#dbe8ff"/>
      <text x="558" y="421" text-anchor="middle" fill="#0157e6" font-size="18" font-weight="700">3</text>
      <text x="595" y="414" fill="#0f1b2d" font-size="21" font-weight="650">向外滑出，腾出位置</text>
      <text x="595" y="444" fill="#6b7c94" font-size="16">任务交回系统后台，空格可以再收纳</text>
    </g>
    <path d="M540 492H970" stroke="#dde6f3"/>
    <text x="540" y="531" fill="#6b7c94" font-size="15">完整输入集中在主窗</text>
    <text x="540" y="556" fill="#8a97a8" font-size="13">布局示意 · 小窗区可选择放在左侧或右侧</text>
  </g>
</svg>

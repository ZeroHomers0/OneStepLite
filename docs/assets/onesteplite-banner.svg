<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">OneStepLite</title>
  <desc id="desc">左侧是蓝橙图标：一个蓝色主窗与三个橙色小窗；右侧是 OneStepLite 名称与副标题。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#fff7f0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6bf0"/><stop offset="1" stop-color="#0157e6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a2b"/><stop offset="1" stop-color="#fe7302"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#page)"/>
  <g transform="translate(96 84)">
    <rect width="232" height="232" rx="52" fill="#fff" stroke="#e6ecf5" stroke-width="2"/>
    <g transform="translate(24 24) scale(3.8333)">
      <rect x="4" y="7.3" width="26.86" height="33.51" rx="5" fill="url(#blue)"/>
      <rect x="8.15" y="12.56" width="18.56" height="3.3" rx="1.65" fill="#fff"/>
      <rect x="7.78" y="19.16" width="19.46" height="17.29" rx="2.02" fill="#fff"/>
      <rect x="32.19" y="7.19" width="11.81" height="10.05" rx="2.39" fill="url(#orange)"/>
      <rect x="32.19" y="18.79" width="11.81" height="10.05" rx="2.39" fill="url(#orange)"/>
      <rect x="32.19" y="30.33" width="11.81" height="10.48" rx="2.39" fill="url(#orange)"/>
    </g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="392" y="196" fill="#0f1b2d" font-size="76" font-weight="700" letter-spacing="-1">OneStepLite</text>
    <text x="396" y="248" fill="#5b6b82" font-size="26">一个主窗，三个真实小窗</text>
    <g transform="translate(396 288)">
      <rect width="132" height="34" rx="17" fill="#e8f0ff"/>
      <text x="66" y="23" text-anchor="middle" fill="#0157e6" font-size="16" font-weight="600">前台多任务</text>
      <rect x="146" width="132" height="34" rx="17" fill="#fff0e2"/>
      <text x="212" y="23" text-anchor="middle" fill="#c85a00" font-size="16" font-weight="600">HyperOS</text>
      <rect x="292" width="132" height="34" rx="17" fill="#eef1f6"/>
      <text x="358" y="23" text-anchor="middle" fill="#4a5a72" font-size="16" font-weight="600">Android 14+</text>
    </g>
  </g>
</svg>

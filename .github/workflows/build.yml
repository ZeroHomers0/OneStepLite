name: Build and publish

# Only a merge into main builds. Pull requests and manual runs are deliberately
# not wired up, so a branch under review never spends runner minutes.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Gradle build is portable, so the release artifact is produced on Linux.
  # verifyApk re-reads the packaged APK the way the Xposed loader will: entry
  # class, Xposed assets, licence bundle and the uncompressed ARM64 library.
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            build.gradle.kts
            app/build.gradle.kts
            settings.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Restore optional release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ONESTEPLITE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ONESTEPLITE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ONESTEPLITE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ONESTEPLITE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64$KEY_ALIAS$STORE_PASSWORD$KEY_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo 'Release signing is required for a tagged release.' >&2
              exit 1
            fi
            exit 0
          fi
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/onesteplite-release.jks"
          chmod 600 "$RUNNER_TEMP/onesteplite-release.jks"
          echo "ONESTEPLITE_KEYSTORE=$RUNNER_TEMP/onesteplite-release.jks" >> "$GITHUB_ENV"
      - name: Build and verify the release APK
        env:
          ONESTEPLITE_KEY_ALIAS: ${{ secrets.ONESTEPLITE_KEY_ALIAS }}
          ONESTEPLITE_STORE_PASSWORD: ${{ secrets.ONESTEPLITE_STORE_PASSWORD }}
          ONESTEPLITE_KEY_PASSWORD: ${{ secrets.ONESTEPLITE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain :app:lintRelease :app:stageRelease
      - name: Collect the APK and checksums
        run: |
          mkdir -p dist/apk
          cp dist/*.apk dist/SHA256SUMS.txt dist/apk/
          cat dist/apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OneStepLite-apk
          path: dist/apk/
          if-no-files-found: error
          retention-days: 30

  # The offline suite drives PowerShell scripts and the JDK through the
  # ONESTEPLITE_JAVA_BIN directory, so it runs on the Windows image where the
  # repository's tooling is native.
  tests:
    name: Offline tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          # sdkmanager asks for every licence interactively; feed it a stream of
          # acceptances so the step stays non-interactive.
          1..20 | ForEach-Object { 'y' } | & $sdkmanager --licenses | Out-Null
          & $sdkmanager 'platforms;android-37.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package installation failed.' }
      - name: Run the offline suite
        shell: pwsh
        run: |
          ./test.ps1 -SdkPath $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Offline tests failed.' }

  # GitHub artifacts always need a signed-in account and always arrive as a zip,
  # so every main build also refreshes a rolling prerelease. Its assets are plain
  # files with a stable public URL, which is what a phone can download directly.
  latest:
    if: github.ref == 'refs/heads/main'
    needs: [apk, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Refresh the rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'OneStepLite-apk' --dir dist
          shopt -s dotglob
          if gh release view latest >/dev/null 2>&1; then
            # Drop assets from the previous build so a renamed file (signed vs
            # unsigned) never lingers next to the fresh one.
            gh release view latest --json assets --jq '.assets[].name' |
              while read -r asset; do
                gh release delete-asset latest "$asset" --yes
              done
            gh release upload latest dist/*/* --clobber
          else
            gh release create latest dist/*/* --prerelease \
              --title "Latest build" \
              --notes "Rolling build of the newest commit on main. Tagged releases are the stable ones."
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish tagged artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'OneStepLite-apk' --dir dist
          shopt -s dotglob
          gh release create "$GITHUB_REF_NAME" dist/*/* --verify-tag \
            --title "OneStepLite $GITHUB_REF_NAME" \
            --generate-notes
